<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="api-base" content="__API_BASE__"><title>AgentCall</title><link rel="stylesheet" href="__API_BASE__/ui/assets/style.css"><script defer src="__API_BASE__/ui/assets/app.js"></script></head><body><main>
<header><div><h1>AgentCall</h1><span id="health" class="small">正在连接服务…</span></div><div class="actions"><a href="__API_BASE__/docs" target="_blank" rel="noopener">API 文档</a><button id="logout">退出登录</button></div></header>
<nav aria-label="功能"><button data-tab="devices" aria-selected="true">手机</button><button data-tab="contacts">联系人</button><button data-tab="calls">通话与记录</button><button data-tab="tasks">AI 任务</button><button data-tab="events">事件</button><button data-tab="settings">设置</button></nav><div id="notice" role="status" hidden></div>
<section id="devices"><h2>手机与蓝牙</h2><div class="actions"><button id="refresh-devices">刷新手机</button><button data-discovery="start">开始发现</button><button data-discovery="stop">停止发现</button><button id="saved-devices">已保存设备</button><button id="refresh-pairing">配对确认</button></div><div id="device-list" class="table"></div><div id="pairing-list"></div><p class="note">首次配对和联系人访问权限需要在手机端允许。断线重连不会自动重新拨号。</p></section>
<section id="contacts" hidden><h2>联系人</h2><form id="contact-search"><label>搜索<input name="q" placeholder="姓名或号码"></label><label>手机<select name="device" class="device-select" data-empty="所有手机"></select></label><label>每页数量<input name="limit" type="number" min="1" max="1000" value="100"></label><label>偏移量<input name="offset" type="number" min="0" value="0"></label><div class="actions"><button>搜索 / 刷新</button><button type="button" id="sync-contacts">同步选中手机</button></div></form><div id="contact-list" class="table"></div></section>
<section id="calls" hidden><h2>通话</h2><form id="dial"><label>手机<select name="device" class="device-select" required></select></label><label>电话号码<input name="number" type="tel" placeholder="与联系人 ID 二选一"></label><label>联系人 ID<input name="contact_id"></label><div class="actions"><button class="primary">拨号</button><button type="button" id="current-calls">刷新当前通话</button></div></form><div id="current-list" class="table"></div><form id="call-control"><label>通话 ID<input name="id" required></label><label>DTMF 数字<input name="digits" pattern="[0-9*#]{1,64}" maxlength="64" placeholder="0–9、*、#"></label><div class="actions"><button name="action" value="answer">接听</button><button name="action" value="hangup">挂断</button><button name="action" value="dtmf">发送 DTMF</button><button name="action" value="show">查看详情 / 音频状态</button></div></form><h3>通话记录</h3><form id="call-search"><label>手机<select name="device" class="device-select" data-empty="所有手机"></select></label><label>来源<select name="source"><option value="">全部</option><option value="project">项目通话</option><option value="pbap">手机历史</option></select></label><label>每页数量<input name="limit" type="number" min="1" max="1000" value="100"></label><label>偏移量<input name="offset" type="number" min="0" value="0"></label><div class="actions"><button>查询记录</button></div></form><div id="call-list" class="table"></div><pre id="call-detail" hidden></pre></section>
<section id="tasks" hidden><h2>AI 通话任务</h2><form id="task-create"><label>手机<select name="device" class="device-select" required></select></label><label>电话号码<input name="number" type="tel" placeholder="与联系人 ID 二选一"></label><label>联系人 ID<input name="contact_id"></label><label>最长通话秒数<input name="max_call_seconds" type="number" min="1" max="3600" value="300" required></label><label class="wide">任务目标<textarea name="goal" maxlength="16000" required></textarea></label><label class="wide">背景信息<textarea name="background" maxlength="16000"></textarea></label><label class="wide">可使用资料（JSON 对象）<textarea name="information" class="json">{}</textarea></label><label class="wide">完成条件<textarea name="completion_criteria" maxlength="16000"></textarea></label><label class="wide">返回字段 / JSON Schema<textarea name="result_schema" class="json">{"type":"object"}</textarea></label><label>Provider<select name="provider"><option value="">使用默认配置</option><option value="openai">OpenAI Realtime</option><option value="gemini">Gemini Live</option></select></label><label>模型<input name="model" placeholder="留空使用默认"></label><label>声音<input name="voice" placeholder="留空使用默认"></label><label>语言<input name="language" placeholder="留空使用默认"></label><label class="wide">Provider 专属参数（JSON 对象，留空使用默认）<textarea name="options" class="json" placeholder="例如：{}"></textarea></label><label class="wide"><input name="start_immediately" type="checkbox">创建后立即排队执行（会实际拨号）</label><div class="actions"><button class="primary">创建任务</button><label>导入任务 JSON<input id="task-file" type="file" accept="application/json,.json"></label></div></form><h3>任务列表</h3><form id="task-search"><label>手机<select name="device" class="device-select" data-empty="所有手机"></select></label><label>状态<select name="state"><option value="">全部</option><option value="saved">待执行</option><option value="queued">排队中</option><option value="preparing">准备中</option><option value="dialing">拨号中</option><option value="in_call">通话中</option><option value="finalizing">整理结果</option><option value="ended">结束</option></select></label><label>结束结果<input name="outcome" placeholder="completed / partial / …"></label><label>每页数量<input name="limit" type="number" min="1" max="1000" value="100"></label><label>偏移量<input name="offset" type="number" min="0" value="0"></label><div class="actions"><button>查询任务</button></div></form><div id="task-list" class="table"></div><form id="task-control"><label>任务 ID<input name="id" required></label><label>启动幂等键<input name="idempotency_key" maxlength="256" placeholder="留空自动生成并复用"></label><label class="wide">补充任务上下文<textarea name="text" maxlength="16000"></textarea></label><div class="actions"><button name="action" value="show">查看任务</button><button name="action" value="start">启动</button><button name="action" value="cancel">取消</button><button name="action" value="result">查看结果</button><button name="action" value="events">对话 / 事件</button><button name="action" value="tools">工具调用</button><button name="action" value="context">补充上下文</button></div></form><pre id="task-detail" hidden></pre></section>
<section id="events" hidden><h2>事件与进度</h2><form id="event-search"><label>手机<select name="device" class="device-select" data-empty="所有手机"></select></label><label>通话 ID<input name="call_id"></label><label>任务 ID<input name="task_id"></label><label>事件类型<input name="kind" placeholder="留空订阅全部"></label><label>历史游标 after_id<input name="after_id" type="number" min="0" value="0"></label><label>历史数量<input name="limit" type="number" min="1" max="1000" value="100"></label><div class="actions"><button>读取历史</button><button type="button" id="watch">开始实时订阅</button><button type="button" id="stop-watch">停止订阅</button></div></form><pre id="event-output">尚未订阅</pre></section>
<section id="settings" hidden><h2>默认配置</h2><p class="note">模型默认值影响新建任务。通话超时和 API 密钥修改后生效；手机连接、监听地址、数据库等设置保存后需重启服务。入口始终使用 PIN 认证。</p><form id="settings-form"><div id="service-fields" class="grid wide"></div><label>默认 Provider<select name="provider"><option value="openai">OpenAI Realtime</option><option value="gemini">Gemini Live</option></select></label><label>模型<input name="model" required></label><label>声音<input name="voice" required></label><label>语言<input name="language" required></label><label class="wide">Provider 专属参数（JSON 对象）<textarea name="options" class="json">{}</textarea></label><div class="actions"><button class="primary">保存配置</button><button type="button" id="reload-settings">重新读取</button></div></form><p id="settings-status" role="status"></p><h3>模型 API Key</h3><p id="credential-status" class="note"></p><p class="note">直接粘贴 API Key 后保存即可。已有密钥不会显示；留空表示不修改。</p><form id="api-keys"><label>OpenAI API Key<input name="openai" type="password" autocomplete="off" spellcheck="false"></label><label>Gemini API Key<input name="gemini" type="password" autocomplete="off" spellcheck="false"></label><div class="actions"><button>保存 API Key</button></div></form><h3>修改 PIN</h3><p class="note">修改 PIN 会退出所有网页会话；已有通话继续运行。</p><form id="credentials"><label>新固定 PIN<input name="pin" type="password" inputmode="numeric" pattern="[0-9]{4}" minlength="4" maxlength="4" autocomplete="new-password"></label><label>再次输入 PIN<input name="confirm" type="password" inputmode="numeric" autocomplete="new-password"></label><div class="actions"><button>修改 PIN</button></div></form></section>
</main></body></html>
