<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="api-base" content="__API_BASE__"><title>AgentCall</title>
<link rel="stylesheet" href="__API_BASE__/ui/assets/style.css">
<script defer src="__API_BASE__/ui/assets/app.js"></script>
</head>
<body><main>
<header><div><h1>AgentCall</h1><span id="health" class="small">正在连接服务…</span></div><button id="logout">退出登录</button></header>
<nav aria-label="功能" role="tablist">
<button id="tab-devices" role="tab" data-tab="devices" aria-controls="devices" aria-selected="true">连接设备</button>
<button id="tab-call" role="tab" data-tab="call" aria-controls="call" aria-selected="false" tabindex="-1">发起通话</button>
<button id="tab-history" role="tab" data-tab="history" aria-controls="history" aria-selected="false" tabindex="-1">查看历史</button>
</nav>
<div id="notice" role="status" hidden></div>
<section id="devices" role="tabpanel" aria-labelledby="tab-devices">
<h2>连接设备</h2>
<div class="actions"><button id="refresh-devices">刷新设备</button><button data-discovery="start">搜索设备</button><button data-discovery="stop">停止搜索</button><button id="refresh-pairing">配对确认</button></div>
<div id="device-list" class="table"></div><div id="pairing-list"></div>
<p class="note">首次配对和联系人访问权限需要在手机上允许。连接后可同步联系人；断线重连不会自动重新拨号。</p>
</section>
<section id="call" role="tabpanel" aria-labelledby="tab-call" hidden>
<h2>发起通话</h2>
<form id="task-create">
<label>通话设备<select name="device" class="device-select" required></select></label>
<label>联系人<select name="contact_id"><option value="">选择联系人或输入号码</option></select></label>
<label>电话号码<input name="number" type="tel" maxlength="64" placeholder="手动输入电话号码" pattern="\+?[0-9*#]{1,64}"></label>
<label>最长通话秒数<input name="max_call_seconds" type="number" min="1" max="3600" step="1" value="300" required></label>
<label>模型<select name="model" required><option value="">正在读取模型…</option></select></label>
<label>声音<select name="voice" required><option value="">正在读取声音…</option></select><span class="small">自动保存，用于之后的新通话。</span></label>
<label>语言<select name="language" required><option value="中文">中文（普通话）</option><option value="粤语">粤语</option><option value="English">English</option><option value="日本語">日本語</option><option value="한국어">한국어</option><option value="Español">Español</option><option value="Français">Français</option><option value="Deutsch">Deutsch</option></select></label>
<label class="wide">目标<textarea name="goal" maxlength="16000" placeholder="说明希望这通电话达成的目标" required></textarea><span class="small">目标同时作为任务完成条件。</span></label>
<label class="wide">固定通话说明<textarea id="default-background" rows="12" readonly>__DEFAULT_BACKGROUND__</textarea><span class="small">由后台永久提供，API 调用无需填写。</span></label>
<label class="wide">补充背景（可选）<textarea name="background" maxlength="16000" placeholder="仅填写这次通话需要补充的事实或资料"></textarea></label>
<div class="actions"><button class="primary" id="start-call">发起通话</button><button type="button" id="refresh-contacts">刷新联系人</button></div>
</form>
<p id="call-defaults-status" class="small" role="status">最长通话秒数、模型和声音会自动保存为默认。</p>
<p id="model-status" class="note"></p>
<h3>当前通话</h3><div id="current-list" class="table"></div><p id="task-status" role="status"></p>
</section>
<section id="history" role="tabpanel" aria-labelledby="tab-history" hidden>
<h2>查看历史</h2>
<div class="actions"><label>通话设备<select id="history-device" class="device-select" data-empty="全部设备"></select></label><button id="refresh-history">刷新历史</button></div>
<div id="history-list" class="table"></div>
<div class="actions"><button id="history-prev" disabled>上一页</button><span id="history-page" class="small"></span><button id="history-next" disabled>下一页</button></div>
<article id="history-detail" tabindex="-1" hidden><h3>通话详情</h3><div id="history-downloads" class="actions"></div><p id="recording-status" class="small"></p><dl id="history-summary"></dl><h3>结果总结</h3><p id="history-summary-model" class="small"></p><div id="history-ai-summary" aria-live="polite"></div><h3>原始结果</h3><pre id="history-result"></pre><h3>Transcript · 对话记录</h3><div id="history-transcript" aria-live="polite"></div></article>
</section>
</main></body></html>
