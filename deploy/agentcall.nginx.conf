# Dedicated loopback gateway; cloudflared is the only public entry point.
map $http_upgrade $agentcall_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 127.0.0.1:8766;
    server_name agenticcall.coldt.uk;
    absolute_redirect off;
    # Cloudflare supplies this header; trust it only from the local tunnel connector.
    set_real_ip_from 127.0.0.1;
    real_ip_header CF-Connecting-IP;
    # Public HTTP visitors are redirected; the origin connection remains HTTP.
    if ($http_x_forwarded_proto = http) {
        return 308 https://agenticcall.coldt.uk$request_uri;
    }
    client_max_body_size 1m;

    location = / {
        default_type application/json;
        return 200 '{"service":"AgentCall","ui":"reserved","api":"/api","docs":"/api/docs"}';
    }

    location = /api {
        return 308 /api/;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8765/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $agentcall_connection_upgrade;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Replace this with the future UI's static files or UI upstream.
    location / {
        return 404;
    }
}
