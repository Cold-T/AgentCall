[service]
host = "127.0.0.1"
port = 8765
adapter = "hci0"
# Start with CVSD for acceptance. mSBC requires libsbc and transparent SCO support.
codec = "cvsd"
# session: normal user obexd; system: explicitly deployed headless obexd.
obex_bus = "session"
database = "~/.local/share/agentcall/agentcall.sqlite3"
token_env = "AGENTCALL_TOKEN"
reconnect_seconds = 5
api_key_env = "OPENAI_API_KEY"
gemini_api_key_env = "GEMINI_API_KEY"
model_connect_seconds = 20
answer_timeout_seconds = 60
audio_timeout_seconds = 10
hangup_timeout_seconds = 5

[provider]
provider = "openai"
model = "gpt-realtime-2.1"
voice = "marin"
language = "中文"
# Optional: options.transcription = { model = "gpt-4o-mini-transcribe" }
# Input turn detection and interruption are handled by the API.
