[service]
host = "127.0.0.1"
port = 8765
# Set to "/api" behind deploy/agentcall.nginx.conf; keep local routes unchanged.
root_path = ""
adapter = "hci0"
# Start with CVSD for acceptance. mSBC requires libsbc and transparent SCO support.
codec = "cvsd"
# session: normal user obexd; system: explicitly deployed headless obexd.
obex_bus = "session"
database = "~/.local/share/agentcall/agentcall.sqlite3"
token_env = "AGENTCALL_TOKEN"
# Fixed PIN mode: requires 4 digits, supports Bearer and Basic user "pin".
pin_auth = false
reconnect_seconds = 5
api_key_env = "OPENAI_API_KEY"
gemini_api_key_env = "GEMINI_API_KEY"
model_connect_seconds = 20
answer_timeout_seconds = 60
audio_timeout_seconds = 10
hangup_timeout_seconds = 5

[provider]
provider = "openai"
model = "gpt-realtime-2.1"
voice = "marin"
language = "中文"
# Optional: options.transcription = { model = "gpt-4o-mini-transcribe" }
# Input turn detection and interruption are handled by the API.

# Starting point for phone audio with false speech triggers; tune per environment.
# Without these overrides, the provider implementation uses semantic_vad.
[provider.options.turn_detection]
type = "server_vad"
threshold = 0.6
prefix_padding_ms = 300
silence_duration_ms = 500
create_response = true
interrupt_response = true

[provider.options.noise_reduction]
type = "near_field"
