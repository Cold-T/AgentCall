name: Software verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update && sudo apt-get install -y dbus libsbc1
      - run: python -m pip install -r requirements-dev.lock -e '.[test]'
      - run: ruff check src tests
      - run: ruff format --check src tests --output-format concise
      - run: pytest -q
      - run: phone --help && agentcall-service --help
